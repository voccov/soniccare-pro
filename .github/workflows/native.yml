name: Build native spike

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Resources/**"
      - "Tests/**"
      - "project.yml"
      - ".github/workflows/native.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          test -n "$DEVICE_ID"
          echo "device=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        timeout-minutes: 15
        run: |
          xcodebuild test \
            -project SonicCarePro.xcodeproj \
            -scheme SonicCarePro \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device }}" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build unsigned device app
        id: build
        run: |
          set +e
          xcodebuild \
            -project SonicCarePro.xcodeproj \
            -scheme SonicCarePro \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "xcodebuild status: $status"
          exit "$status"

      - name: Publish failure log
        if: failure() && steps.build.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-log
          name: Native build log
          prerelease: true
          make_latest: false
          files: build.log

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SonicCarePro.app Payload/
          zip -qry SonicCarePro.ipa Payload
          ls -lh SonicCarePro.ipa

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-latest
          name: SonicCare native spike
          prerelease: true
          make_latest: false
          files: SonicCarePro.ipa
